# SPDX-License-Identifier: MPL-2.0
name: Corpus compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1, 2, 3]
    env:
      TEST_SLOT: ${{ strategy.job-index }}/${{ strategy.job-total }}
      CORPUS_REPORT: build/comparison/${{ strategy.job-index }}-${{ strategy.job-total }}/all
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download tested renderer and tools
        uses: actions/download-artifact@v7
        with:
          name: traceur-ditaa-classes
          path: build/classes/java

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select test slot
        run: ./gradlew selectTestSlot -PtestSlot="$TEST_SLOT"

      - name: Install SVG rasteriser
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin

      - name: Fetch selected inputs and reference binaries
        run: |
          jbang tools/FetchPinnedCorpus.java build/test-slots/manifest.tsv "$RUNNER_TEMP/corpus"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/plantuml.jar" https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2026.8/plantuml-1.2026.8.jar
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ditaa.jar" https://github.com/stathissideris/ditaa/releases/download/v0.11.0/ditaa-0.11.0-standalone.jar
          sha256sum --check <<EOF
          0f77e5f769836b3dee340e207fe497c3e4c43e973d559e3c306915da9c32e34c  $RUNNER_TEMP/plantuml.jar
          9418aa63ff6d89c5d2318396f59836e120e75bea7a5930c4d34aa10fe7a196a9  $RUNNER_TEMP/ditaa.jar
          EOF

      - name: Run corpus test suite
        run: >-
          ./gradlew corpusTest -x compileJava -x compileToolsJava
          -PtestSlot="$TEST_SLOT"
          -Pcorpus="$RUNNER_TEMP/corpus/inputs"
          -PpngReference="$RUNNER_TEMP/plantuml.jar"
          -PsvgReference="$RUNNER_TEMP/ditaa.jar"

      - name: Upload slot results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-results-${{ matrix.slot }}
          path: |
            ${{ env.CORPUS_REPORT }}/results.tsv
            ${{ env.CORPUS_REPORT }}/environment.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload corpus test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corpus-test-reports-${{ matrix.slot }}
          path: |
            build/test-results/corpusTest/
            build/reports/tests/corpusTest/
          if-no-files-found: error
          retention-days: 7
