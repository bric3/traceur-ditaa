# SPDX-License-Identifier: MPL-2.0
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_releaseTag: ${{ github.event.release.tag_name }}
      ORG_GRADLE_PROJECT_releasePrerelease: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Java 11
        id: java11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Java 25
        id: java25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Build and test on Java 11 and Java 25
        env:
          JAVA_TOOLCHAIN_PATHS: ${{ steps.java11.outputs.path }},${{ steps.java25.outputs.path }}
        run: ./gradlew build -Porg.gradle.java.installations.paths="$JAVA_TOOLCHAIN_PATHS"

      - name: Upload tested renderer and tools
        uses: actions/upload-artifact@v6
        with:
          name: traceur-ditaa-classes
          path: |
            build/classes/java/main/
            build/classes/java/tools/
          if-no-files-found: error
          retention-days: 7

      - name: Upload tested JARs
        uses: actions/upload-artifact@v6
        with:
          name: traceur-ditaa-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
          retention-days: 7

  corpus:
    needs: build
    uses: ./.github/workflows/corpus.yml

  verified:
    needs: [build, corpus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and every corpus slot
        if: needs.build.result != 'success' || needs.corpus.result != 'success'
        run: exit 1

  publish:
    needs: verified
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_releaseTag: ${{ github.event.release.tag_name }}
      ORG_GRADLE_PROJECT_releasePrerelease: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Download tested JARs
        uses: actions/download-artifact@v7
        with:
          name: traceur-ditaa-jars
          path: build/libs

      - name: Attach JARs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/libs/*.jar --clobber

      - name: Sign and publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -x jar -x sourcesJar -x javadocJar
