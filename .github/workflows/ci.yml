# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    env:
      ORG_GRADLE_PROJECT_snapshot: 'true'
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 11
        id: java11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Java 25
        id: java25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Install SVG rasteriser
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin

      - name: Build and test on Java 11 and Java 25
        env:
          JAVA_TOOLCHAIN_PATHS: ${{ steps.java11.outputs.path }},${{ steps.java25.outputs.path }}
        run: ./gradlew build -Porg.gradle.java.installations.paths="$JAVA_TOOLCHAIN_PATHS"

      - name: Set up JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Fetch pinned compatibility references
        run: |
          jbang tools/FetchPinnedCorpus.java corpus/manifest.tsv "$RUNNER_TEMP/traceur-ditaa-corpus"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/plantuml.jar" https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2026.8/plantuml-1.2026.8.jar
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ditaa.jar" https://github.com/stathissideris/ditaa/releases/download/v0.11.0/ditaa-0.11.0-standalone.jar
          sha256sum --check <<EOF
          0f77e5f769836b3dee340e207fe497c3e4c43e973d559e3c306915da9c32e34c  $RUNNER_TEMP/plantuml.jar
          9418aa63ff6d89c5d2318396f59836e120e75bea7a5930c4d34aa10fe7a196a9  $RUNNER_TEMP/ditaa.jar
          EOF

      - name: Require complete corpus compatibility
        run: >-
          ./gradlew compareCorpus
          -Pcorpus="$RUNNER_TEMP/traceur-ditaa-corpus/inputs"
          -Poracle="$RUNNER_TEMP/plantuml.jar"
          -PsvgOracle="$RUNNER_TEMP/ditaa.jar"

      - name: Generate line coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          jbang src/tools/java/CoverageBadge.java
          build/reports/jacoco/test/jacocoTestReport.xml
          build/coverage-badge/coverage.json

      - name: Upload coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-badge
          path: build/coverage-badge/
          if-no-files-found: error
          retention-days: 7

      - name: Upload compatibility results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-results
          path: |
            build/comparison/results.tsv
            build/comparison/environment.txt
          retention-days: 7

      - name: Publish snapshot to Central
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: ./gradlew publishAggregationToCentralSnapshots

      - name: Upload JARs
        uses: actions/upload-artifact@v6
        with:
          name: traceur-ditaa-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'build/test-results/**/TEST-*.xml'
          check_name: Test Results
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          detailed_summary: true
          include_passed: true
          fail_on_failure: true

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  coverage:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download badge from this build
        uses: actions/download-artifact@v7
        with:
          name: coverage-badge
          path: build/coverage-badge

      - name: Publish coverage badge data
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: badges
          folder: build/coverage-badge
          force: false
          commit-message: 'chore: update coverage badge'

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JARs from this build
        uses: actions/download-artifact@v7
        with:
          name: traceur-ditaa-jars
          path: artifacts

      - name: Create or update draft release
        uses: ncipollo/release-action@v1
        with:
          tag: development-preview
          commit: ${{ github.sha }}
          name: Development preview
          draft: true
          allowUpdates: true
          skipIfReleaseExists: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: artifacts/*.jar
          makeLatest: false
          body: |
            Experimental Java 11 library for rendering ditaa diagrams as PNG and SVG.
            All pinned corpus comparisons match exactly.

            Built from ${{ github.sha }}.
            See the [validation snapshot](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/VALIDATION.md) for comparison and cold-start results.
