# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    env:
      ORG_GRADLE_PROJECT_snapshot: 'true'
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 11
        id: java11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Java 25
        id: java25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Build and test on Java 11 and Java 25
        env:
          JAVA_TOOLCHAIN_PATHS: ${{ steps.java11.outputs.path }},${{ steps.java25.outputs.path }}
        run: ./gradlew build -Porg.gradle.java.installations.paths="$JAVA_TOOLCHAIN_PATHS"

      - name: Set up JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Generate line coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          jbang src/tools/java/CoverageBadge.java
          build/reports/jacoco/test/jacocoTestReport.xml
          build/coverage-badge/coverage.json

      - name: Upload coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-badge
          path: build/coverage-badge/
          if-no-files-found: error
          retention-days: 7

      - name: Upload tested renderer and tools
        uses: actions/upload-artifact@v6
        with:
          name: traceur-ditaa-classes
          path: |
            build/classes/java/main/
            build/classes/java/tools/
          if-no-files-found: error
          retention-days: 7

      - name: Upload JARs
        uses: actions/upload-artifact@v6
        with:
          name: traceur-ditaa-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'build/test-results/**/TEST-*.xml'
          check_name: Test Results
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          detailed_summary: true
          include_passed: true
          fail_on_failure: true

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  corpus:
    needs: build
    uses: ./.github/workflows/corpus.yml

  verified:
    needs: [build, corpus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and every corpus slot
        if: needs.build.result != 'success' || needs.corpus.result != 'success'
        run: exit 1

  snapshot:
    needs: verified
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_snapshot: 'true'
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Download tested JARs
        uses: actions/download-artifact@v7
        with:
          name: traceur-ditaa-jars
          path: build/libs
      - name: Publish tested snapshot to Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: ./gradlew publishAggregationToCentralSnapshots -x jar -x sourcesJar -x javadocJar

  coverage:
    needs: verified
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download badge from this build
        uses: actions/download-artifact@v7
        with:
          name: coverage-badge
          path: build/coverage-badge

      - name: Publish coverage badge data
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: badges
          folder: build/coverage-badge
          force: false
          commit-message: 'chore: update coverage badge'

  release:
    needs: verified
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download tested renderer and tools
        uses: actions/download-artifact@v7
        with:
          name: traceur-ditaa-classes
          path: build/classes/java

      - name: Select newest draft release
        id: draft
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const draft = releases.filter(r => r.draft)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (!draft) return core.notice('No draft release to refresh.');
            core.setOutput('id', draft.id);
            core.setOutput('tag', draft.tag_name);
            core.setOutput('prerelease', draft.prerelease);

      - name: Set up Gradle
        if: steps.draft.outputs.id != ''
        uses: gradle/actions/setup-gradle@v5

      - name: Package tested classes with the draft version
        if: steps.draft.outputs.id != ''
        env:
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.draft.outputs.prerelease }}
        run: |
          git tag --no-sign "$RELEASE_TAG" "$GITHUB_SHA"
          ./gradlew jar sourcesJar javadocJar -x compileJava -PreleaseTag="$RELEASE_TAG" -PreleasePrerelease="$RELEASE_PRERELEASE"

      - name: Check draft target is still current
        if: steps.draft.outputs.id != ''
        id: release_revision
        uses: actions/github-script@v8
        with:
          script: |
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            const current = ref.object.sha === context.sha;
            core.setOutput('current', current);
            if (!current) core.notice('Skipping draft refresh because main has advanced.');

      - name: Update selected draft release
        if: steps.release_revision.outputs.current == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.draft.outputs.tag }}
          commit: ${{ github.sha }}
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: build/libs/*.jar
          makeLatest: false

      - name: Verify updated draft
        if: steps.release_revision.outputs.current == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            const {data: draft} = await github.rest.repos.getRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID)
            });
            if (!draft.draft || draft.target_commitish !== context.sha || draft.assets.length !== 3) {
              core.setFailed('Draft target or JAR uploads were not updated.');
            }
